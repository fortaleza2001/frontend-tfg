<div class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-6">
    <!-- Encabezado -->
    <header class="w-full bg-blue-600 text-white text-center py-6 shadow-lg">
      <h1 class="text-4xl font-bold">Gestión de Vuelos</h1>
      <p class="text-lg mt-2">Administra los vuelos de la aerolínea</p>
    </header>
  
    <!-- Contenedor principal -->
    <div class="bg-white shadow-xl rounded-lg p-8 mt-8 max-w-3xl w-full">
      <h2 class="text-2xl font-semibold text-gray-800 text-center">Lista de Vuelos</h2>
      <p class="text-gray-600 mt-2 text-center">Visualiza y gestiona los vuelos programados</p>
  
      <!-- Barra de búsqueda -->
      <div class="mt-4">
        <input 
          type="text" 
          placeholder="Buscar vuelo, origen, destino..." 
          (input)="filtrarVuelos($event)" 
          class="w-full p-3 border border-gray-300 rounded-lg"
        />
      </div>
  
      <!-- Tabla de vuelos -->
      <div class="mt-6 overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200">
          <thead>
            <tr class="bg-blue-600 text-white">
              <th class="py-3 px-6 border">Vuelo</th>
              <th class="py-3 px-6 border">Origen</th>
              <th class="py-3 px-6 border">Destino</th>
              <th class="py-3 px-6 border">Hora</th>
              <th class="py-3 px-6 border">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Loop a través de los vuelos paginados -->
            <tr *ngFor="let vuelo of vuelosPaginados" class="text-center border-b hover:bg-gray-100">
              <td class="py-3 px-6 border">{{ vuelo.codigo }}</td>
              <td class="py-3 px-6 border">{{ vuelo.origen }}</td>
              <td class="py-3 px-6 border">{{ vuelo.destino }}</td>
              <td class="py-3 px-6 border">{{ vuelo.hora }}</td>
              <td class="py-3 px-6 border">
                <button class="bg-yellow-500 text-white py-1 px-3 rounded hover:bg-yellow-600">Editar</button>
                <button class="bg-red-500 text-white py-1 px-3 rounded hover:bg-red-600 ml-2">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
  
      <!-- Botón de agregar vuelo -->
      <div class="mt-6 text-center">
        <button class="bg-green-600 text-white py-3 px-6 rounded-lg text-lg font-semibold hover:bg-green-700">Agregar Vuelo</button>
      </div>
  
      <!-- Paginación -->
      <div class="mt-6 flex justify-center">
        <button (click)="paginaAnterior()" class="px-4 py-2 bg-gray-300 rounded-md hover:bg-gray-400" [disabled]="paginaActual === 1">Anterior</button>
        <span class="mx-4 text-lg">{{ paginaActual }} de {{ totalPaginas }}</span>
        <button (click)="paginaSiguiente()" class="px-4 py-2 bg-gray-300 rounded-md hover:bg-gray-400" [disabled]="paginaActual === totalPaginas">Siguiente</button>
      </div>
    </div>
  </div>
