<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="max-w-4xl w-full bg-white p-8 rounded-lg shadow-lg space-y-6 relative">
      <!-- Título principal -->

      <!-- Botón Volver atrás -->
      <div class="mb-6">
        <button
          type="button"
          (click)="volverAtras()"
          class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-400 transition-all duration-300"
        >
          Volver Atrás
        </button>
      </div>
      
      <h1 class="text-4xl font-extrabold text-center text-gray-800 mb-8">
        Crear nueva aerolínea
      </h1>
  
      
  
      <!-- Encabezado de fases -->
      <div class="flex justify-center items-center text-xl font-semibold text-gray-700 space-x-8">
        <span
          [ngClass]="{'cursor-pointer': true, 'text-blue-600': fase === 1, 'font-bold': fase === 1}"
          class="fase-etapa"
          
        >Fase 1</span>
        <span>/</span>
        <span
          [ngClass]="{'cursor-pointer': true, 'text-blue-600': fase === 2, 'font-bold': fase === 2}"
          class="fase-etapa"
         
        >Fase 2</span>
        <span>/</span>
        <span
          [ngClass]="{'cursor-pointer': true, 'text-blue-600': fase === 3, 'font-bold': fase === 3}"
          class="fase-etapa"
         
        >Fase 3</span>
      </div>
  
      <!-- Título dinámico -->
      <h2 id="form-title" class="text-3xl font-extrabold text-center text-gray-800 mt-4">
        {{ fase === 1 ? 'Información básica' : fase === 2 ? 'Datos de pago y protección de datos' : 'Detalles finales' }}
      </h2>
      <!-- Mensaje de error -->
<div *ngIf="errorCreacion" class="text-red-600 font-medium text-center bg-red-100 border border-red-300 px-4 py-2 rounded">
  {{ errorCreacion }}
</div>

  
      <!-- Formulario -->
      <form (ngSubmit)="crearAerolinea()" class="space-y-6">
        <!-- Paso 1: Información del creador -->
        <div class="form-step" *ngIf="fase === 1">
          <label class="block text-sm font-medium text-gray-700 mt-4">Nombre completo del creador</label>
          <input
            type="text"
            placeholder="Ej: Juan Pérez"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.nombreCreador"
            name="nombreCreador"
            required
            maxlength="100"
          />
          
          <label class="block text-sm font-medium text-gray-700 mt-4">DNI del creador</label>
          <input
            type="text"
            placeholder="Ej: 12345678A"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.dniCreador"
            name="dniCreador"
            required
            pattern="^\d{8}[A-Za-z]$"
            maxlength="9"
          />
          
          <label class="block text-sm font-medium text-gray-700 mt-4">Dirección del creador</label>
          <input
            type="text"
            placeholder="Ej: Calle Falsa 123"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.direccionCreador"
            name="direccionCreador"
            required
            maxlength="150"
          />
          
          <label class="block text-sm font-medium text-gray-700 mt-4">Número de teléfono</label>

          <div class="flex">
            <!-- Selector de prefijo -->
            <select
              [(ngModel)]="aerolinea.prefijoTelefono"
              name="prefijoTelefono"
              required
              class="w-1/4 p-3 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
              <option value="" disabled selected>+34</option>
              <option value="+34">+34 España</option>
              <option value="+1">+1 Estados Unidos</option>
              <option value="+44">+44 Reino Unido</option>
              <option value="+33">+33 Francia</option>
              <option value="+49">+49 Alemania</option>
              <!-- Agrega más países aquí según sea necesario -->
            </select>
          
            <!-- Campo de número de teléfono -->
            <input
              type="tel"
              placeholder="Ej: 600 123 456"
              class="w-3/4 p-3 border border-gray-300 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              [(ngModel)]="aerolinea.numeroTelefono"
              name="numeroTelefono"
              required
              pattern="^\d{9,15}$"
              title="Introduce un número de teléfono válido, sin el prefijo."
            />
          </div>
          
          
          <label class="block text-sm font-medium text-gray-700 mt-4">Fecha de nacimiento del creador</label>
          <input
            type="date"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.fechaNacimientoCreador"
            name="fechaNacimientoCreador"
            required
            
          />
          

          <!-- Checkbox de protección de datos -->
          <div class="mt-4">
            <label class="flex items-center space-x-2">
              <input
                type="checkbox"
                [(ngModel)]="aerolinea.proteccionDatos"
                name="proteccionDatos"
                required
              />
              <span class="text-sm">
                Acepto la <a href="#" class="text-blue-600">política de protección de datos personales</a>
              </span>
            </label>
          </div>
        </div>

        <div class="form-step" *ngIf="fase === 2">
          <!-- Nombre en la tarjeta -->
          <input
          type="text"
          placeholder="Nombre en la tarjeta"
          class="w-full p-3 border border-gray-300 rounded-lg mt-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
          [(ngModel)]="cuentaPago.nombreTarjeta"
          name="nombreTarjeta"
          required
          />

          <!-- Número de tarjeta -->
          <input
          type="text"
          placeholder="Número de tarjeta"
          maxlength="19"
          class="w-full p-3 border border-gray-300 rounded-lg mt-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
          [(ngModel)]="cuentaPago.numeroTarjeta"
          name="numeroTarjeta"
          required
          />

         <!-- Fecha de caducidad de la tarjeta -->
         <div class="mt-4">
          <label for="fechaCaducidad" class="block text-sm font-semibold text-gray-700 mb-1">
            Fecha de caducidad de la tarjeta <span class="text-gray-400">(MM/AAAA)</span>
          </label>
          
          <input
            id="fechaCaducidad"
            type="month"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            [(ngModel)]="cuentaPago.fechaCaducidad"
            name="fechaCaducidad"
            required
          />
        </div>
        


          <!-- Código CVV -->
          <input
          type="text"
          placeholder="CVV"
          maxlength="4"
          class="w-full p-3 border border-gray-300 rounded-lg mt-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
          [(ngModel)]="cuentaPago.cvv"
          name="cvv"
          required
          />

        </div>

        <div class="form-step" *ngIf="fase === 3">
          
          <!-- Nombre de la aerolínea -->
            <input
            type="text"
            placeholder="Nombre de la aerolínea"
            class="w-full p-3 border border-gray-300 rounded-lg mt-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.nombreAerolinea"
            name="nombreAerolinea"
            required
            />

            <!-- Logo de la aerolínea (no requerido) -->
           <!-- Subida del logo de la aerolínea -->
         <!-- Etiqueta -->
<label class="block mt-6 text-sm font-medium text-gray-700">
  Logo de la aerolínea (opcional)
</label>

<!-- Input de archivo -->
<input
  type="file"
  accept="image/*"
  class="w-full p-3 border border-gray-300 rounded-lg mt-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"
  (change)="onLogoSelected($event)"
  name="logoAerolinea"
/>

<!-- Texto de ayuda -->
<p class="text-sm text-gray-500 mt-1">
  Sube el logo de tu aerolínea. Se mostrará abajo como vista previa.
</p>

<!-- Vista previa en forma circular -->
<img
  *ngIf="logoPreview"
  [src]="logoPreview"
  alt="Vista previa del logo"
  class="mt-4 w-32 h-32 object-cover rounded-full shadow-md border border-gray-300"
/>



            <!-- Dirección de la aerolínea -->
            <input
            type="text"
            placeholder="Dirección de la aerolínea"
            class="w-full p-3 border border-gray-300 rounded-lg mt-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.direccionAerolinea"
            name="direccionAerolinea"
            required
            />

            <!-- Código IATA -->
            <input
            type="text"
            placeholder="Código IATA"
            maxlength="3"
            class="w-full p-3 border border-gray-300 rounded-lg mt-4 uppercase focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.codigoIATA"
            name="codigoIATA"
            required
            />

            <!-- País de origen -->
            <input
            type="text"
            placeholder="País de origen"
            class="w-full p-3 border border-gray-300 rounded-lg mt-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="aerolinea.paisOrigen"
            name="paisOrigen"
            required
            />

          
         

        </div>
  
        <!-- Botones -->
        <div class="flex justify-between items-center mt-6">
          <button
            id="btn-atras"
            type="button"
            (click)="bajarFase()"
            class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-400 transition-all duration-300"
            *ngIf="fase > 1">
            Atrás
          </button>
  
          <button
            id="btn-continuar"
            type="button"
            (click)="subirFase()"
            class="ml-auto bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition-all duration-300"
            *ngIf="fase < 3">
            Continuar
          </button>
  
          <button
            id="btn-enviar"
            type="submit"
            class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 transition-all duration-300"
            *ngIf="fase === 3">
            Crear Aerolínea
          </button>
        </div>

        
      </form>
    </div>
  </div>
