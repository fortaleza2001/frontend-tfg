<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navbar con Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hero section background */
    .hero-section {
      background-image: url('https://media.revistagq.com/photos/5ed5285ef95b900ced636e6d/16:9/w_1920,c_limit/GettyImages-619394704.jpg');
      background-position: center;
      background-size: cover;
      height: 400px;
      position: relative;
    }
  </style>
</head>
<body class="font-sans bg-gray-100">

<!-- Barra de navegación -->
<nav class="bg-white shadow-md">
  <div class="max-w-screen-xl mx-auto px-4 py-4 flex items-center justify-between">
    
    <!-- Logo -->
    <a href="/" class="flex items-center space-x-2 text-xl font-semibold text-blue-600">
      <img src="https://flowbite.com/docs/images/logo.svg" alt="Logo" class="h-8" />
      <span>FlightApp</span>
    </a>

    <!-- Menú de navegación -->
    <div class="hidden md:flex space-x-6 justify-center flex-1">
      <!-- Enlaces de páginas -->
      <a href="/reserva" class="text-gray-800 hover:text-blue-600">Reserva</a>
      <a href="/aerolineas" class="text-gray-800 hover:text-blue-600">Aerolíneas</a>
      <a href="/promociones" class="text-gray-800 hover:text-blue-600">Promociones</a>
      <a href="/soporte" class="text-gray-800 hover:text-blue-600">Soporte</a>
    </div>

    <!-- Botones de autenticación si el usuario no está logueado -->
    <div *ngIf="!isLoggedIn" class="flex space-x-4" id="auth-buttons">
      <a href="/login" class="text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-md border border-blue-600">Iniciar sesión</a>
      <a href="/registro" class="text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-md border border-blue-600">Registrarse</a>
    </div>

    <div *ngIf="isLoggedIn" class="flex items-center justify-center space-x-4" id="user-info">
      <div class="relative inline-block text-left">
        <!-- Botón del usuario -->
        <button (click)="toggleDropdown()" 
            class="flex items-center space-x-2 bg-white text-blue-700 py-2 px-4 rounded-full hover:bg-gray-200 focus:outline-none">
            <span>{{ username }}</span>
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
        </button>
    
        <!-- Menú desplegable -->
        <div *ngIf="dropdownOpen" class="absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-lg z-50">
          <button  class="w-full text-left block px-4 py-2 hover:bg-gray-200">
            Perfil
          </button>
          
          <button (click)="irAerolineas()"  class="w-full text-left block px-4 py-2 hover:bg-gray-200">
            Aerolineas
          </button>
          
          <button (click)="logout()" class="w-full text-left block px-4 py-2 hover:bg-gray-200">
            Logout
          </button>
          
        </div>
      </div>
    </div>
    

  </div>
</nav>



  <!-- Zona de filtro de búsqueda -->
  <div class="container mx-auto mt-12 p-6 bg-white rounded-lg shadow-lg" id="filter-container">
    <h4 class="text-xl font-semibold text-gray-700 mb-6">Filtro de Búsqueda</h4>
    <form>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div>
          <label for="origen" class="block text-gray-700">Origen</label>
          <input type="text" id="origen" class="w-full mt-2 p-3 border border-gray-300 rounded-lg" placeholder="Ciudad de origen">
        </div>
        <div>
          <label for="destino" class="block text-gray-700">Destino</label>
          <input type="text" id="destino" class="w-full mt-2 p-3 border border-gray-300 rounded-lg" placeholder="Ciudad de destino">
        </div>
        <div>
          <label for="fechaSalida" class="block text-gray-700">Fecha de Salida</label>
          <input type="date" id="fechaSalida" class="w-full mt-2 p-3 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label for="fechaRegreso" class="block text-gray-700">Fecha de Regreso</label>
          <input type="date" id="fechaRegreso" class="w-full mt-2 p-3 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label for="pasajeros" class="block text-gray-700">Pasajeros</label>
          <input type="number" id="pasajeros" class="w-full mt-2 p-3 border border-gray-300 rounded-lg" min="1" value="1">
        </div>
        <div class="col-span-full">
          <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-500 transition duration-300">Buscar</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Imagen con texto superpuesto -->
  <div class="hero-section relative mt-12">
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center text-white bg-black bg-opacity-60 px-6 py-4 rounded-lg">
      <h2 class="text-3xl font-bold">Descubra las mejores ofertas</h2>
    </div>
  </div>

  <!-- Spinner de carga -->
  <div id="spinner" class="flex justify-center items-center mt-12 hidden">
    <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent border-solid rounded-full animate-spin"></div>
  </div>

  <script>
    // Simulación de estado de carga
    document.addEventListener('DOMContentLoaded', () => {
      const isLoading = false;
      if (isLoading) {
        document.getElementById('spinner').classList.remove('hidden');
        document.getElementById('filter-container').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
