   <!-- Botón Volver al Home -->
<!-- Botón Volver al Home -->

<div class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-10">
    <a href="/home" class="inline-block px-4 py-2 bg-gray-500 text-white rounded-full hover:bg-gray-600 transition duration-300 mb-4">
        Volver al Home
      </a>
    <!-- Sección Información de la Aerolínea -->
    <div class="aerolinea-info mb-6 p-6 bg-white shadow-[10px_10px_20px_rgba(0,0,0,0.2)] rounded-lg">
      <div class="flex justify-center mb-6">
        <img *ngIf="aerolinea?.logoAerolinea" [src]="aerolinea?.logoAerolinea" alt="Logo Aerolínea" class="w-40 h-40 rounded-full shadow-md">
      </div>
      <h2 class="text-3xl font-semibold text-center text-gray-800 mb-4">{{ aerolinea?.nombreAerolinea }}</h2>
  
      <div class="space-y-4">
        <div class="flex justify-between">
          <span class="font-medium text-gray-700">Código IATA:</span>
          <span class="text-gray-600">{{ aerolinea?.codigoIATA }}</span>
        </div>
        <div class="flex justify-between">
          <span class="font-medium text-gray-700">Dirección:</span>
          <span class="text-gray-600">{{ aerolinea?.direccionAerolinea }}</span>
        </div>
        <div class="flex justify-between">
          <span class="font-medium text-gray-700">País de Origen:</span>
          <span class="text-gray-600">{{ aerolinea?.paisOrigen }}</span>
        </div>
      </div>
    </div>
  
    <!-- Sección Gráfico de Beneficios -->
    <div class="aerolinea-beneficios mb-6 p-6 bg-white shadow-[0px_10px_20px_rgba(0,0,0,0.2)] rounded-lg">
      <h3 class="text-2xl font-semibold text-gray-800 mb-4">Gráfico de Beneficios</h3>
      <div class="bg-gray-100 p-6 rounded-lg shadow-md">
        <!-- Gráfico con Chart.js -->
        <canvas id="lineChart">{{ lineChart }}</canvas>
      </div>
    </div>
  
    <!-- Sección Acciones de la Aerolínea -->
    <div class="aerolinea-acciones mb-6 p-6 bg-white shadow-[0px_10px_20px_rgba(0,0,0,0.2)] rounded-lg">
      <h3 class="text-2xl font-semibold text-gray-800 mb-4">Acciones de la Aerolínea</h3>
      <div class="space-y-4">
        <button class="w-full px-6 py-2 bg-green-500 text-white rounded-full hover:bg-green-600 transition duration-300">
          Añadir Usuario Administrador
        </button>
        <button class="w-full px-6 py-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition duration-300">
          Eliminar Aerolínea
        </button>
        <button class="w-full px-6 py-2 bg-blue-500 text-white rounded-full hover:bg-blue-600 transition duration-300">
          Ver Estadísticas de la Aerolínea
        </button>
      </div>
    </div>
  
  </div>
