<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .register-card {
      padding: 40px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .register-card h2 {
      margin-bottom: 20px;
      color: #007bff;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      transition: background-color 0.3s;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .social-login button {
      margin-top: 10px;
      width: 100%;
      border-radius: 10px;
      padding: 12px;
    }
    .error-message {
      color: red;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <h2 class="text-center">Crear Cuenta</h2>
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required />
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required />
          <div *ngIf="password && confirmPassword && password !== confirmPassword" class="error-message">
            Las contraseñas no coinciden
          </div>
        </div>
        <button (click)="onRegister()" type="button" class="btn btn-primary w-100">Registrarse</button>
      </form>
      
      <p class="mt-3 text-center">¿Ya tienes cuenta? <a href="/login" class="text-primary">Inicia sesión aquí</a></p>

      <!-- Botones de Redes Sociales -->
      <div class="social-login">
        <button class="btn btn-dark" >
          <i class="bi bi-github"></i> Registrarse con GitHub
        </button>
        <button class="btn btn-danger" >
          <i class="bi bi-google"></i> Registrarse con Google
        </button>
        <button class="btn btn-primary" >
          <i class="bi bi-facebook"></i> Registrarse con Facebook
        </button>
      </div>
    </div>
  </div>

  <script>
    function registerWithProvider(provider) {
      alert(`Redirigiendo a registro con ${provider}`);
      // Aquí puedes implementar la lógica de redirección a tu backend o proveedor OAuth
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
