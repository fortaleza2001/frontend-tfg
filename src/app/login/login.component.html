<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-card {
      padding: 40px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      margin-bottom: 20px;
      color: #007bff;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      transition: background-color 0.3s;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .form-text {
      color: #6c757d;
    }
    .social-login button {
      margin-top: 10px;
      width: 100%;
      border-radius: 10px;
      padding: 12px;
    }
  </style>
</head>
<body>

  <div class="login-container">

    <div class="login-card">
      <!-- Botón Volver Atrás -->
<a href="/home" class="btn btn-secondary mb-3 d-flex align-items-center gap-2">
  <i class="bi bi-arrow-left"></i> Volver atrás
</a>
      <h2 class="text-center">Iniciar Sesión</h2>
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Recuérdame</label>
        </div>
        <button (click)="onLogin()" type="button" class="btn btn-primary w-100">Acceder</button>
        <p class="mt-3 text-center"><a href="/Formulario/Recuperar-password" class="text-primary">¿Olvidaste tu contraseña?</a></p>
        <p class="mt-3 text-center">
            ¿No tienes cuenta? <a href="/registro" class="text-primary">Regístrate aquí</a>
        </p>
      </form>

      <!-- Botones de Redes Sociales -->
      <div class="social-login">
        <p class="text-center">O inicia sesión con</p>
        <button class="btn btn-dark" (click)="onLoginGithub()">
          <i class="bi bi-github"></i> Iniciar sesión con GitHub
        </button>
        <button class="btn btn-danger" (click)="onLoginGoogle()">
          <i class="bi bi-google"></i> Iniciar sesión con Google
        </button>
        <!--
        <button class="btn btn-primary" (click)="onLoginFacebook()">
          <i class="bi bi-facebook"></i> Iniciar sesión con Facebook
        </button>
        -->
      </div>
    </div>
  </div>

  <script>
    function loginWithProvider(provider) {
      alert(`Redirigiendo a inicio de sesión con ${provider}`);
      // Aquí podrías agregar la redirección a tu backend o proveedor OAuth
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
